<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Hubungi WhatsApp</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7f6;
      font-family: Arial, sans-serif;
      color: #333;
      text-align: center;
    }

    .box {
      width: 85%;
      max-width: 400px;
      padding: 32px 20px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 25px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Menghubungkan ke WhatsApp</h2>
    <p>Sila tunggu sebentar...</p>

    <a id="whatsappButton" class="button" href="#">
      Buka WhatsApp
    </a>
  </div>

  <script>
    (() => {
      /* 填写你的WhatsApp号码 */
      const rawNumbers = [
        "601121397178",
        "601137587578",
        "601167612846",
        "601137473049"
      ];

      /* 清理及检查号码 */
      const numbers = [...new Set(
        rawNumbers
          .map(number => String(number).replace(/\D/g, ""))
          .filter(number => /^\d{8,15}$/.test(number))
      )];

      if (numbers.length === 0) {
        document.querySelector(".box").innerHTML =
          "<h2>Nombor WhatsApp tidak tersedia</h2>";
        return;
      }

      /* 随机选择一个号码 */
      const selectedNumber =
        numbers[Math.floor(Math.random() * numbers.length)];

      /* 自动预设消息 */
      const message =
        "Hi, saya ingin mengetahui maklumat lanjut.";

      /* 兼容性更好的WhatsApp链接 */
      const whatsappUrl =
        "https://api.whatsapp.com/send?phone=" +
        selectedNumber +
        "&text=" +
        encodeURIComponent(message);

      /* 设置手动点击按钮 */
      const button = document.getElementById("whatsappButton");
      button.href = whatsappUrl;

      /* 1秒后自动跳转 */
      setTimeout(() => {
        window.location.href = whatsappUrl;
      }, 1000);
    })();
  </script>
</body>
</html>
